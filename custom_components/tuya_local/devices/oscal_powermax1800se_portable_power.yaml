# OSCAL PowerMax 1800 SE (EU-LP) — Tuya Local profile archive
#
# Scope: only DPS observed on the local device and confirmed through physical
# controls or the Smart Life dashboard on 2026-09-08.
#
# Deployment target (copy manually after review):
# /config/custom_components/tuya_local/devices/oscal_powermax1800se_portable_power.yaml
#
# Safety: AC output (DP 6) is deliberately read-only because it supplies Home
# Assistant.  DC (DP 7), light (DP 9), and beep (DP 25) were safely verified.

name: OSCAL PowerMax 1800 SE portable power station

products:
  - id: sgjrplhxfruooz9t
    manufacturer: OSCAL
    model: PowerMax 1800 SE

entities:
  - entity: sensor
    class: battery
    dps:
      - id: 1
        type: integer
        name: sensor
        unit: "%"
        class: measurement
      - id: 112
        type: integer
        optional: true
        name: power_packs

  - entity: binary_sensor
    name: AC output enabled
    dps:
      - id: 6
        type: boolean
        name: sensor

  - entity: switch
    name: DC output
    dps:
      - id: 7
        type: boolean
        name: switch

  # Confirmed by the Tuya product model; separate from the device beep (DP 25).
  - entity: switch
    name: Key sound
    category: config
    dps:
      - id: 12
        type: boolean
        name: switch

  # Confirmed by the Tuya product model. It controls the USB output group.
  - entity: switch
    name: USB output
    dps:
      - id: 19
        type: boolean
        name: switch

  - entity: select
    name: Light
    dps:
      - id: 9
        type: string
        name: option
        mapping:
          - dps_val: "off"
            value: "Off"
          - dps_val: "bright"
            value: "Bright"
          - dps_val: "high_bright"
            value: "High brightness"
          - dps_val: "sos"
            value: "SOS"
          - dps_val: "breath"
            value: "Breathing"
          - dps_val: "flash"
            value: "Flash"

  - entity: sensor
    name: Battery temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 10
        type: integer
        name: sensor
        class: measurement
      - id: 24
        type: string
        name: unit
        mapping:
          - dps_val: "c"
            value: C
          - dps_val: "f"
            value: F

  - entity: select
    name: Temperature unit
    category: config
    dps:
      - id: 24
        type: string
        name: option
        mapping:
          - dps_val: "c"
            value: Celsius
          - dps_val: "f"
            value: Fahrenheit

  - entity: switch
    name: Beep
    category: config
    dps:
      - id: 25
        type: boolean
        name: switch

  - entity: sensor
    name: Remaining hours
    class: duration
    category: diagnostic
    dps:
      - id: 37
        type: integer
        name: sensor
        unit: h
        class: measurement

  - entity: sensor
    name: Firmware version
    category: diagnostic
    dps:
      - id: 102
        type: string
        name: sensor

  - entity: sensor
    name: Total input
    class: power
    category: diagnostic
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: W
        class: measurement

  # Confirmed locally and corroborated by the PowerMax 2400 Tuya Local profile.
  - entity: sensor
    name: Battery status
    class: enum
    category: diagnostic
    dps:
      - id: 110
        type: string
        name: sensor
        mapping:
          - dps_val: "0"
            value: Standby
          - dps_val: "1"
            value: Charging
          - dps_val: "2"
            value: Discharging

  - entity: sensor
    name: AC input power
    class: power
    category: diagnostic
    dps:
      - id: 111
        type: integer
        name: sensor
        unit: W
        class: measurement

  - entity: sensor
    name: Solar input power
    class: power
    category: diagnostic
    dps:
      - id: 113
        type: integer
        name: sensor
        unit: W
        class: measurement

  - entity: sensor
    name: Total output
    class: power
    dps:
      - id: 104
        type: integer
        name: sensor
        unit: W
        class: measurement

  - entity: sensor
    name: AC output power
    class: power
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: W
        class: measurement

  - entity: number
    name: Charge limit
    category: config
    icon: "mdi:battery-charging-90"
    dps:
      - id: 106
        type: integer
        name: value
        unit: "%"
        range:
          min: 70
          max: 100

  - entity: number
    name: Discharge limit
    category: config
    icon: "mdi:battery-20"
    dps:
      - id: 107
        type: integer
        name: value
        unit: "%"
        range:
          min: 0
          max: 30

  # Verified in Smart Life: slow-charge power setting (watts).
  - entity: number
    name: Slow charge power
    category: config
    icon: "mdi:battery-charging-low"
    dps:
      - id: 128
        type: integer
        name: value
        unit: W
        range:
          min: 100
          max: 800
        mapping:
          - step: 100

  # Screen auto-off timeout. Values are retained only after local-DPS confirmation.
  - entity: select
    name: Screen auto-off
    category: config
    icon: "mdi:monitor-off"
    dps:
      - id: 109
        type: string
        name: option
        mapping:
          # Inferred from the confirmed 5min and 10min protocol values.
          - dps_val: "1min"
            value: "1 minute"
          - dps_val: "5min"
            value: "5 minutes"
          - dps_val: "10min"
            value: "10 minutes"
          - dps_val: "30min"
            value: "30 minutes"
          - dps_val: "never_close"
            value: Never

  # AC standby timeout. The displayed value is confirmed as "1hour" locally.
  - entity: select
    name: AC standby timeout
    category: config
    icon: "mdi:power-sleep"
    dps:
      - id: 139
        type: string
        name: option
        mapping:
          - dps_val: "30min"
            value: "30 minutes"
          - dps_val: "1hour"
            value: "1 hour"
          - dps_val: "2hour"
            value: "2 hours"
          - dps_val: "4hour"
            value: "4 hours"
          - dps_val: "6hour"
            value: "6 hours"
          - dps_val: "12hour"
            value: "12 hours"
          - dps_val: "24hour"
            value: "24 hours"
          - dps_val: "never_close"
            value: Never

  - entity: sensor
    name: Remaining days
    class: duration
    category: diagnostic
    dps:
      - id: 108
        type: integer
        name: sensor
        unit: d
        class: measurement

  - entity: sensor
    name: DC output power
    class: power
    category: diagnostic
    dps:
      - id: 116
        type: integer
        name: sensor
        unit: W
        class: measurement

  # USB output power is reported in tenths of a watt by the product model.
  # It is disabled by default until the device is observed reporting DP 117.
  - entity: sensor
    name: USB output power
    class: power
    category: diagnostic
    hidden: true
    dps:
      - id: 117
        type: integer
        optional: true
        name: sensor
        unit: W
        class: measurement
        mapping:
          - scale: 10

  # Verified locally: sending text causes the device to emit Morse code.
  - entity: text
    name: Morse message
    category: config
    icon: "mdi:message-text"
    dps:
      - id: 118
        type: string
        name: text

  - entity: sensor
    name: Remaining minutes
    class: duration
    category: diagnostic
    dps:
      - id: 127
        type: integer
        name: sensor
        unit: min
        class: measurement

  # DP 146 and 147 were observed locally; 148 is optional in the product model.
  - entity: sensor
    name: Inverter firmware version
    category: diagnostic
    dps:
      - id: 146
        type: string
        name: sensor

  - entity: sensor
    name: BMS firmware version
    category: diagnostic
    dps:
      - id: 147
        type: string
        name: sensor

  - entity: sensor
    name: MPPT firmware version
    category: diagnostic
    hidden: true
    dps:
      - id: 148
        type: string
        optional: true
        name: sensor
